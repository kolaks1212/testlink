[phases.setup]
# نصب Chromium، Xvfb و کتابخانه‌های سیستمی موردنیاز
aptPkgs = [
    "chromium",
    "xvfb",
    "libnss3",
    "libatk-bridge2.0-0",
    "libgtk-3-0",
    "libgbm1",
    "libasound2",
    "libxss1"
]

[phases.install]
# نصب وابستگی‌های پایتون
cmds = ["pip install -r requirements.txt"]

[phases.build]
# دانلود پیشاپیش Chromium سفارشی CloakBrowser (حدود ۲۰۰ مگابایت، فقط بار اول ساخت)
cmds = [
    "python -c \"import cloakbrowser; cloakbrowser.ensure_binary()\" || echo 'CloakBrowser binary skip'"
]

[start]
# نکته کلیدی: اجرا با xvfb-run برای ساخت نمایشگر مجازی
cmd = "xvfb-run -a --server-args='-screen 0 1920x1080x24 -ac' python main.py"
